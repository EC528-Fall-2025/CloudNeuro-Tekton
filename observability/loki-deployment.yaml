apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: chris-students-c9344e
  labels:
    app: loki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
      - name: loki
        image: grafana/loki:3.0.0
        args:
          - -config.file=/etc/loki/loki.yaml
        ports:
          - containerPort: 3100
            name: http
        volumeMounts:
          - name: loki-config
            mountPath: /etc/loki/
          - name: loki-storage
            mountPath: /var/loki
      volumes:
        - name: loki-config
          configMap:
            name: loki-config
        - name: loki-storage
          persistentVolumeClaim:
            claimName: loki-pvc
