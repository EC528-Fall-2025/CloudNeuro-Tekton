deploymentMode: SingleBinary

loki:
  commonConfig:
    replication_factor: 1

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h


  storage:
    type: filesystem

  filesystem:
    chunks_directory: /var/loki/chunks
    rules_directory: /var/loki/rules

singleBinary:
  replicas: 1

securityContext:
      runAsUser: null
      runAsGroup: null
      fsGroup: null

# Zero out replica counts of other deployment modes
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomCompactor:
  replicas: 0
bloomGateway:
  replicas: 0

persistence:
  enabled: true
  size: 5Gi
  storageClassName: ocs-external-storagecluster-ceph-rbd

resources:
  limits:
    cpu: 200m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false

rbac:
  create: true
  namespaced: true

memcached:
  enabled: false
memcachedExporter:
  enabled: false