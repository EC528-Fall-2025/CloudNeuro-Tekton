apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: chris-students-c9344e
data:
  loki.yaml: |
    target: all

    server:
      http_listen_port: 3100

    auth_enabled: false

    common:
      path_prefix: /var/loki

    storage_config:
      filesystem:
        directory: /var/loki/chunks

    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    limits_config:
      allow_structured_metadata: false

    ruler:
      rule_path: /var/loki/rules
      storage:
        local:
          directory: /var/loki/rules
      enable_api: true
