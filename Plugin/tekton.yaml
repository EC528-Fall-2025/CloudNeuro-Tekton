# TASK 1: Download one Orthanc series
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: download-orthanc-series
spec:
  params:
    - name: orthancUrl
      type: string
    - name: orthancAuth
      type: string
    - name: patientId
      type: string
    - name: studyId
      type: string
    - name: seriesId
      type: string
  workspaces:
    - name: shared
  steps:
    - name: download
      image: curlimages/curl:8.7.1
      script: |
        #!/bin/sh
        set -eux
        BASE_DIR="$(workspaces.shared.path)/$(params.patientId)/$(params.studyId)/$(params.seriesId)"
        mkdir -p "${BASE_DIR}"

        ZIP_FILE="${BASE_DIR}/series.zip"
        echo " Downloading series $(params.seriesId) from Orthanc..."
        curl -s -u "$(params.orthancAuth)" \
          "$(params.orthancUrl)/series/$(params.seriesId)/archive" \
          -o "${ZIP_FILE}"

        if [ -s "${ZIP_FILE}" ]; then
          echo " Download complete: ${ZIP_FILE}"
        else
          echo " Empty or failed download."
        fi

    - name: unzip
      image: busybox:1.36.1
      script: |
        #!/bin/sh
        set -eux
        BASE_DIR="$(workspaces.shared.path)/$(params.patientId)/$(params.studyId)/$(params.seriesId)"
        ZIP_FILE="${BASE_DIR}/series.zip"
        if [ -s "${ZIP_FILE}" ]; then
          unzip -o "${ZIP_FILE}" -d "${BASE_DIR}" >/dev/null 2>&1 || true
          rm -f "${ZIP_FILE}"
        fi
        echo " Example DICOMs:"
        find "${BASE_DIR}" -type f -name "*.dcm" | head || true

---

# TASK 2: Convert DICOM → NIFTI
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: dcm2niix-convert
spec:
  params:
    - name: patientId
      type: string
    - name: studyId
      type: string
    - name: seriesId
      type: string
  workspaces:
    - name: shared
  results:
    - name: nifti_filename
      description: "First NIfTI file generated from DICOM series"
    - name: metadata_filename
      description: "Matching metadata JSON file for the first NIfTI"
  steps:
    - name: convert
      image: ghcr.io/fnndsc/pl-dcm2niix:latest
      script: |
        #!/bin/sh
        set -eux
        INPUT_DIR="$(workspaces.shared.path)/$(params.patientId)/$(params.studyId)/$(params.seriesId)"
        OUTPUT_DIR="$(workspaces.shared.path)/NIFTI"
        mkdir -p "${OUTPUT_DIR}"

        echo " Starting conversion from DICOM → NIFTI..."
        dcm2niix -b y -z y -o "${OUTPUT_DIR}" "${INPUT_DIR}"

        NIFTI_FILE=$(find "${OUTPUT_DIR}" -type f -name "*.nii.gz" | head -n1)
        NIFTI_NAME=$(basename "$NIFTI_FILE")
        META_FILE="${NIFTI_FILE%.nii.gz}.json"
        META_NAME=$(basename "$META_FILE")

        echo -n "$NIFTI_NAME" > $(results.nifti_filename.path)
        echo -n "$META_NAME" > $(results.metadata_filename.path)

        echo " Conversion complete. Example outputs:"
        find "${OUTPUT_DIR}" -type f | head -n 10 || true

---

# TASK 3: Run pl-emerald + mask + metadata check
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: emerald-extraction
spec:
  params:
    - name: pattern
      type: string
    - name: maskSuffix
      type: string
      default: "_mask.nii"
    - name: patientId
      type: string
    - name: studyId
      type: string
    - name: seriesId
      type: string
  workspaces:
    - name: shared
  steps:
    # Step 1: Run EMERALD segmentation
    - name: emerald
      image: ghcr.io/fnndsc/pl-emerald:latest
      script: |
        #!/bin/sh
        set -eux
        INPUT_DIR="$(workspaces.shared.path)/NIFTI"
        OUTPUT_DIR="$(workspaces.shared.path)/EMERALD"
        mkdir -p "${OUTPUT_DIR}"

        echo "Running EMERALD extraction..."
        emerald --pattern "$(params.pattern)" \
                --mask-suffix "$(params.maskSuffix)" \
                "${INPUT_DIR}" "${OUTPUT_DIR}"

        echo "Extraction complete. Example outputs:"
        find "${OUTPUT_DIR}" -type f | head -n 10 || true

    # Step 2: Apply mask to MRI using nibabel + numpy
    - name: apply-mask
      image: python:3.11-slim
      script: |
        #!/usr/bin/env bash
        pip install nibabel numpy
        python3 - <<'EOF'
        import nibabel as nib
        import numpy as np
        import glob
        import os

        mri_path = "$(workspaces.shared.path)/NIFTI/$(params.pattern)"
        base_name = os.path.basename(mri_path).replace(".nii.gz", "")
        mask_candidates = glob.glob(f"$(workspaces.shared.path)/EMERALD/{base_name}*mask*.nii*")

        if not mask_candidates:
            raise FileNotFoundError(f"No mask found for {mri_path}")
        mask_path = mask_candidates[0]

        out_path = "$(workspaces.shared.path)/EMERALD/MR_masked_brain.nii.gz"
        print(f"Loading MRI from {mri_path}")
        print(f"Loading mask from {mask_path}")

        mri_img = nib.load(mri_path)
        mask_img = nib.load(mask_path)
        mri_data = mri_img.get_fdata()
        mask_data = mask_img.get_fdata()

        print("MRI shape:", mri_data.shape)
        print("Mask shape:", mask_data.shape)

        if mri_data.shape != mask_data.shape:
            raise ValueError("MRI and mask shapes do not match. Check registration or affine matrices.")

        masked_data = mri_data * (mask_data > 0)
        masked_img = nib.Nifti1Image(masked_data, affine=mri_img.affine, header=mri_img.header)
        nib.save(masked_img, out_path)
        print(f"Saved masked volume: {out_path}")

    # # Step 3: Inspect DICOM metadata (sanity check)
    # - name: inspect-dicom
    #   image: python:3.11-slim
    #   script: |
    #     #!/usr/bin/env sh
    #     set -eux
    #     pip install --no-cache-dir pydicom
    #     python3 - <<'EOF'

    #     import pydicom
    #     ds = pydicom.dcmread("$(workspaces.shared.path)/$(params.patientId)/$(params.studyId)/$(params.seriesId)/IM_0001.dcm")
    #     print(ds)

---

# TASK 4: Convert NIFTI → DICOM (fixed for image pull)
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: nifti2dicom-convert
spec:
  params:
    - name: niftiFilename
      type: string
      description: "Name of the NIFTI file to convert back to DICOM"
    - name: patientId
      type: string
      description: "Patient ID (used for metadata restoration)"
    - name: studyId
      type: string
      description: "Study ID for locating reference DICOMs"
    - name: seriesId
      type: string
      description: "Series ID for locating reference DICOMs"
    - name: SOPClassUID
      type: string
      description: "SOP Class UID to set in DICOM metadata"
  workspaces:
    - name: shared
  steps:
    # Convert using reference DICOM for metadata
    - name: convert-with-reference
      image: python:3.11-slim
      script: |
        #!/usr/bin/env bash
        set -eux
        pip install --no-cache-dir pydicom nibabel numpy SimpleITK
        
        python3 - <<'EOF'
        import os
        import pydicom
        import nibabel as nib
        import numpy as np
        from datetime import datetime
        import glob
        
        # Paths
        workspace = "$(workspaces.shared.path)"
        nifti_path = os.path.join(workspace, "EMERALD", "MR_masked_brain.nii.gz")
        original_dicom_dir = os.path.join(workspace, "$(params.patientId)", "$(params.studyId)", "$(params.seriesId)")
        output_dir = os.path.join(workspace, "DICOM_RECONVERTED")
        os.makedirs(output_dir, exist_ok=True)
        
        print(f"Loading NIFTI from: {nifti_path}")
        print(f"Reference DICOM directory: {original_dicom_dir}")

        # Load NIFTI
        nii_img = nib.load(nifti_path)
        nii_data = nii_img.get_fdata()
        
        # Find reference DICOM
        # Find reference DICOMs recursively
        ref_dicoms = sorted(
            glob.glob(os.path.join(original_dicom_dir, "**", "*.dcm"), recursive=True)
        )

        if not ref_dicoms:
            raise FileNotFoundError(
                f"No reference DICOMs found under {original_dicom_dir} (searched recursively)"
            )

        ref_ds = pydicom.dcmread(ref_dicoms[0])
        print(f"Using reference DICOM: {ref_dicoms[0]}")
        print(f"Original SOP Class: {ref_ds.SOPClassUID}")
        
        # Prepare for slice-by-slice conversion
        if len(nii_data.shape) == 3:
            num_slices = nii_data.shape[2]
        else:
            raise ValueError(f"Expected 3D NIFTI, got shape {nii_data.shape}")
        
        print(f"Converting {num_slices} slices...")
        
        # Generate new UIDs for the converted series
        new_study_uid = ref_ds.StudyInstanceUID  # Keep same study
        new_series_uid = pydicom.uid.generate_uid()  # New series for processed data
        
        for slice_idx in range(num_slices):
            # Create new DICOM from reference
            new_ds = ref_ds.copy()
            
            # Extract slice data
            slice_data = nii_data[:, :, slice_idx]
            
            # Normalize to appropriate range for DICOM (0-4095 for 12-bit)
            slice_min = slice_data.min()
            slice_max = slice_data.max()
            if slice_max > slice_min:
                slice_normalized = ((slice_data - slice_min) / (slice_max - slice_min) * 4095).astype(np.uint16)
            else:
                slice_normalized = np.zeros_like(slice_data, dtype=np.uint16)
            
            # Update pixel data
            new_ds.PixelData = slice_normalized.tobytes()
            
            # Update image dimensions
            new_ds.Rows = slice_normalized.shape[0]
            new_ds.Columns = slice_normalized.shape[1]
            new_ds.BitsAllocated = 16
            new_ds.BitsStored = 12
            new_ds.HighBit = 11
            new_ds.SamplesPerPixel = 1
            new_ds.PhotometricInterpretation = "MONOCHROME2"
            new_ds.PixelRepresentation = 0
            
            # Update UIDs - CRITICAL for Orthanc
            new_ds.SeriesInstanceUID = new_series_uid
            new_ds.SOPInstanceUID = pydicom.uid.generate_uid()
            new_ds.file_meta.MediaStorageSOPInstanceUID = new_ds.SOPInstanceUID
            
            # Update instance number
            new_ds.InstanceNumber = slice_idx + 1
            
            # Update series metadata
            new_ds.SeriesDescription = "AI Brain Mask - EMERALD"
            new_ds.SeriesNumber = getattr(ref_ds, 'SeriesNumber', 999) + 1000
            
            # Update timestamps
            now = datetime.now()
            new_ds.SeriesDate = now.strftime('%Y%m%d')
            new_ds.SeriesTime = now.strftime('%H%M%S')
            new_ds.ContentDate = now.strftime('%Y%m%d')
            new_ds.ContentTime = now.strftime('%H%M%S')
            
            # Ensure Transfer Syntax is set
            if not hasattr(new_ds.file_meta, 'TransferSyntaxUID'):
                new_ds.file_meta.TransferSyntaxUID = pydicom.uid.ExplicitVRLittleEndian
            
            # Save DICOM
            output_path = os.path.join(output_dir, f"slice_{slice_idx:04d}.dcm")
            new_ds.save_as(output_path, write_like_original=False)
            
            if slice_idx % 10 == 0:
                print(f"Processed slice {slice_idx + 1}/{num_slices}")
        
        print(f"Successfully created {num_slices} DICOM slices in {output_dir}")
        print(f"Series UID: {new_series_uid}")
        
        # Verify first file
        verify_ds = pydicom.dcmread(os.path.join(output_dir, "slice_0000.dcm"))
        print(f"Verification - First slice:")
        print(f"  Rows x Columns: {verify_ds.Rows} x {verify_ds.Columns}")
        print(f"  Series Description: {verify_ds.SeriesDescription}")
        print(f"  SOP Class UID: {verify_ds.SOPClassUID}")
        EOF

    

---

# PIPELINE: download -> pl-dcm2niix -> pl-emerald
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: orthanc-to-better-dicom
spec:
  params:
    - name: orthancUrl
      type: string
    - name: orthancAuth
      type: string
    - name: patientId
      type: string
    - name: studyId
      type: string
    - name: seriesId
      type: string
    - name: SOPClassUID
      type: string
    - name: pattern
      type: string
      # default: "DICOM_SAG_MPRAGE_220_FOV_20130308074224_5.nii.gz"
    - name: maskSuffix
      type: string
      default: "_mask.nii"
  workspaces:
    - name: shared
  tasks:
    - name: download
      taskRef:
        name: download-orthanc-series
      params:
        - name: orthancUrl
          value: $(params.orthancUrl)
        - name: orthancAuth
          value: $(params.orthancAuth)
        - name: patientId
          value: $(params.patientId)
        - name: studyId
          value: $(params.studyId)
        - name: seriesId
          value: $(params.seriesId)
        - name: SOPClassUID
          value: $(params.SOPClassUID)
      workspaces:
        - name: shared
          workspace: shared

    - name: convert
      runAfter: [download]
      taskRef:
        name: dcm2niix-convert
      params:
        - name: patientId
          value: $(params.patientId)
        - name: studyId
          value: $(params.studyId)
        - name: seriesId
          value: $(params.seriesId)
      workspaces:
        - name: shared
          workspace: shared

    - name: emerald
      runAfter: [convert]
      taskRef:
        name: emerald-extraction
      params:
        - name: pattern
          value: "$(tasks.convert.results.nifti_filename)"
        - name: maskSuffix
          value: $(params.maskSuffix)
        - name: patientId
          value: $(params.patientId)
        - name: studyId
          value: $(params.studyId)
        - name: seriesId
          value: $(params.seriesId)
      workspaces:
        - name: shared
          workspace: shared

    
    - name: nifti2dicom
      runAfter: [emerald]
      taskRef:
        name: nifti2dicom-convert
      params:
        - name: niftiFilename
          value: "$(tasks.convert.results.nifti_filename)"
        - name: patientId
          value: $(params.patientId)
        - name: studyId
          value: $(params.studyId)       
        - name: seriesId
          value: $(params.seriesId)    
        - name: SOPClassUID
          value: $(params.SOPClassUID)
      workspaces:
        - name: shared
          workspace: shared
