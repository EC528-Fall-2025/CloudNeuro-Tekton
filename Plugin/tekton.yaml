# TASK 1: Download one Orthanc series
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: download-orthanc-series
spec:
  params:
    - name: orthancUrl
      type: string
    - name: orthancAuth
      type: string
    - name: patientId
      type: string
    - name: studyId
      type: string
    - name: seriesId
      type: string
  workspaces:
    - name: shared
  steps:
    - name: download
      image: curlimages/curl:8.7.1
      script: |
        #!/bin/sh
        set -eux
        BASE_DIR="$(workspaces.shared.path)/$(params.patientId)/$(params.studyId)/$(params.seriesId)"
        mkdir -p "${BASE_DIR}"

        ZIP_FILE="${BASE_DIR}/series.zip"
        echo " Downloading series $(params.seriesId) from Orthanc..."
        curl -s -u "$(params.orthancAuth)" \
          "$(params.orthancUrl)/series/$(params.seriesId)/archive" \
          -o "${ZIP_FILE}"

        if [ -s "${ZIP_FILE}" ]; then
          echo " Download complete: ${ZIP_FILE}"
        else
          echo " Empty or failed download."
        fi

    - name: unzip
      image: busybox:1.36.1
      script: |
        #!/bin/sh
        set -eux
        BASE_DIR="$(workspaces.shared.path)/$(params.patientId)/$(params.studyId)/$(params.seriesId)"
        ZIP_FILE="${BASE_DIR}/series.zip"
        if [ -s "${ZIP_FILE}" ]; then
          unzip -o "${ZIP_FILE}" -d "${BASE_DIR}" >/dev/null 2>&1 || true
          rm -f "${ZIP_FILE}"
        fi
        echo " Example DICOMs:"
        find "${BASE_DIR}" -type f -name "*.dcm" | head || true

---

# TASK 2: Convert DICOM → NIFTI
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: dcm2niix-convert
spec:
  params:
    - name: patientId
      type: string
  workspaces:
    - name: shared
  results:
    - name: nifti_filename
      description: "First NIfTI file generated from DICOM series"
    - name: metadata_filename
      description: "Matching metadata JSON file for the first NIfTI"
  steps:
    - name: convert
      image: ghcr.io/fnndsc/pl-dcm2niix:latest
      script: |
        #!/bin/sh
        set -eux
        INPUT_DIR="$(workspaces.shared.path)/$(params.patientId)"
        OUTPUT_DIR="$(workspaces.shared.path)/NIFTI"
        mkdir -p "${OUTPUT_DIR}"

        echo " Starting conversion from DICOM → NIFTI..."
        dcm2niix -b y -z y -o "${OUTPUT_DIR}" "${INPUT_DIR}"

        NIFTI_FILE=$(find "${OUTPUT_DIR}" -type f -name "*.nii.gz" | head -n1)
        NIFTI_NAME=$(basename "$NIFTI_FILE")
        META_FILE="${NIFTI_FILE%.nii.gz}.json"
        META_NAME=$(basename "$META_FILE")

        echo -n "$NIFTI_NAME" > $(results.nifti_filename.path)
        echo -n "$META_NAME" > $(results.metadata_filename.path)

        echo " Conversion complete. Example outputs:"
        find "${OUTPUT_DIR}" -type f | head -n 10 || true

---

# TASK 3: Run pl-emerald
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: emerald-extraction
spec:
  params:
    - name: pattern
      type: string
      # default: "DICOM_SAG_MPRAGE_220_FOV_20130308074224_5.nii.gz"
    - name: maskSuffix
      type: string
      default: "_mask.nii"
  workspaces:
    - name: shared
  steps:
    - name: emerald
      image: ghcr.io/fnndsc/pl-emerald:latest
      script: |
        #!/bin/sh
        set -eux
        INPUT_DIR="$(workspaces.shared.path)/NIFTI"
        OUTPUT_DIR="$(workspaces.shared.path)/EMERALD"
        mkdir -p "${OUTPUT_DIR}"

        echo "Running EMERALD extraction..."
        emerald --pattern "$(params.pattern)" \
                --mask-suffix "$(params.maskSuffix)" \
                "${INPUT_DIR}" "${OUTPUT_DIR}"

        echo "Extraction complete. Example outputs:"
        find "${OUTPUT_DIR}" -type f | head -n 10 || true

---

# TASK 4: Convert NIFTI → DICOM (fixed for image pull)
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: nifti2dicom-convert
spec:
  params:
    - name: niftiFilename
      type: string
      description: "Name of the NIFTI file to convert back to DICOM"
    - name: patientId
      type: string
      description: "Patient ID (used for metadata restoration)"
  workspaces:
    - name: shared
  steps:
    # Step 1: Convert NIFTI → DICOM
    - name: convert-back
      # Use the public v0.1.5 tag (known working)
      image: ghcr.io/tomaroberts/nii2dcm:latest
      script: |
        #!/bin/sh
        set -eux
        INPUT_DIR="$(workspaces.shared.path)/NIFTI"
        OUTPUT_DIR="$(workspaces.shared.path)/DICOM_RECONVERTED"
        mkdir -p "${OUTPUT_DIR}"

        NIFTI_FILE="${INPUT_DIR}/$(params.niftiFilename)"
        echo "Converting NIFTI → DICOM using nii2dcm..."
        nii2dcm "${NIFTI_FILE}" "${OUTPUT_DIR}"

        echo "Conversion done. Example outputs:"
        find "${OUTPUT_DIR}" -type f -name "*.dcm" | head || true

    # Step 2: Patch metadata back into DICOMs
    - name: patch-metadata
      # Use GitHub Container Registry to avoid Docker Hub rate limits
      image: python:3.11-slim
      script: |
        #!/usr/bin/env sh
        set -eux
        pip install --no-cache-dir pydicom
        python3 - <<'EOF'
        
        import os, pydicom

        out_dir = os.path.join("$(workspaces.shared.path)", "DICOM_RECONVERTED")
        patient_id = "$(params.patientId)"
        print(f"Patching DICOM metadata in {out_dir} for PatientID={patient_id}")

        for root, _, files in os.walk(out_dir):
            for f in files:
                if not f.endswith(".dcm"):
                    continue
                path = os.path.join(root, f)
                ds = pydicom.dcmread(path)
                # Update key metadata fields
                ds.PatientID = patient_id
                ds.PatientName = "AI_Segmentation_Result"
                ds.SeriesDescription = "AI segmentation of fetal brain"
                ds.save_as(path)
        print("Metadata restoration complete.")

---

# PIPELINE: download -> pl-dcm2niix -> pl-emerald
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: orthanc-to-better-dicom
spec:
  params:
    - name: orthancUrl
      type: string
    - name: orthancAuth
      type: string
    - name: patientId
      type: string
    - name: studyId
      type: string
    - name: seriesId
      type: string
    - name: pattern
      type: string
      # default: "DICOM_SAG_MPRAGE_220_FOV_20130308074224_5.nii.gz"
    - name: maskSuffix
      type: string
      default: "_mask.nii"
  workspaces:
    - name: shared
  tasks:
    - name: download
      taskRef:
        name: download-orthanc-series
      params:
        - name: orthancUrl
          value: $(params.orthancUrl)
        - name: orthancAuth
          value: $(params.orthancAuth)
        - name: patientId
          value: $(params.patientId)
        - name: studyId
          value: $(params.studyId)
        - name: seriesId
          value: $(params.seriesId)
      workspaces:
        - name: shared
          workspace: shared

    - name: convert
      runAfter: [download]
      taskRef:
        name: dcm2niix-convert
      params:
        - name: patientId
          value: $(params.patientId)
      workspaces:
        - name: shared
          workspace: shared

    - name: emerald
      runAfter: [convert]
      taskRef:
        name: emerald-extraction
      params:
        - name: pattern
          value: "$(tasks.convert.results.nifti_filename)"
        - name: maskSuffix
          value: $(params.maskSuffix)
      workspaces:
        - name: shared
          workspace: shared
    
    - name: nifti2dicom
      runAfter: [emerald]
      taskRef:
        name: nifti2dicom-convert
      params:
        - name: niftiFilename
          value: "$(tasks.convert.results.nifti_filename)"
        - name: metadataFilename
          value: "$(tasks.convert.results.metadata_filename)"
        - name: patientId
          value: $(params.patientId)
      workspaces:
        - name: shared
          workspace: shared


---

# PIPELINE RUN
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: orthanc-to-better-dicom-run
spec:
  pipelineRef:
    name: orthanc-to-better-dicom
  params:
    - name: orthancUrl
      value: "https://orthanc-chris.apps.shift.nerc.mghpcc.org"
    - name: orthancAuth
      value: "orthanc-720:jennings-minions"
    - name: patientId
      value: "7c222fb2-927d828a-f22f5921-34e89324-80637c0d"
    - name: studyId
      value: "37eccdd3-37e25c5f-1bd55640-81525651-e9b5e18b"
    - name: seriesId
      value: "d06ab3c7-c739be04-509c1388-5381e6c8-7e6e7765"
    - name: pattern
      value: "DICOM_SAG_MPRAGE_220_FOV_20130308074224_5.nii.gz"
    - name: maskSuffix
      value: "_mask.nii"
  workspaces:
    - name: shared
      persistentVolumeClaim:
        claimName: dicom-pvc
