# TASK 1: Download one Orthanc series
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: download-orthanc-series
spec:
  params:
    - name: orthancUrl
      type: string
    - name: orthancAuth
      type: string
    - name: patientId
      type: string
    - name: studyId
      type: string
    - name: seriesId
      type: string
  workspaces:
    - name: shared
  steps:
    - name: download
      image: curlimages/curl:8.7.1
      script: |
        #!/bin/sh
        set -eux
        BASE_DIR="$(workspaces.shared.path)/$(params.patientId)/$(params.studyId)/$(params.seriesId)"
        mkdir -p "${BASE_DIR}"

        ZIP_FILE="${BASE_DIR}/series.zip"
        echo " Downloading series $(params.seriesId) from Orthanc..."
        curl -s -u "$(params.orthancAuth)" \
          "$(params.orthancUrl)/series/$(params.seriesId)/archive" \
          -o "${ZIP_FILE}"

        if [ -s "${ZIP_FILE}" ]; then
          echo " Download complete: ${ZIP_FILE}"
        else
          echo " Empty or failed download."
        fi

    - name: unzip
      image: busybox:1.36.1
      script: |
        #!/bin/sh
        set -eux
        BASE_DIR="$(workspaces.shared.path)/$(params.patientId)/$(params.studyId)/$(params.seriesId)"
        ZIP_FILE="${BASE_DIR}/series.zip"
        if [ -s "${ZIP_FILE}" ]; then
          unzip -o "${ZIP_FILE}" -d "${BASE_DIR}" >/dev/null 2>&1 || true
          rm -f "${ZIP_FILE}"
        fi
        echo " Example DICOMs:"
        find "${BASE_DIR}" -type f -name "*.dcm" | head || true

---

# TASK 2: Convert DICOM → NIFTI
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: dcm2niix-convert
spec:
  params:
    - name: patientId
      type: string
    - name: studyId
      type: string
    - name: seriesId
      type: string
  workspaces:
    - name: shared
  results:
    - name: nifti_filename
      description: "First NIfTI file generated from DICOM series"
    - name: metadata_filename
      description: "Matching metadata JSON file for the first NIfTI"
  steps:
    - name: convert
      image: ghcr.io/fnndsc/pl-dcm2niix:latest
      script: |
        #!/bin/sh
        set -eux
        INPUT_DIR="$(workspaces.shared.path)/$(params.patientId)/$(params.studyId)/$(params.seriesId)"
        OUTPUT_DIR="$(workspaces.shared.path)/NIFTI"
        mkdir -p "${OUTPUT_DIR}"

        echo " Starting conversion from DICOM → NIFTI..."
        dcm2niix -b y -z y -o "${OUTPUT_DIR}" "${INPUT_DIR}"

        NIFTI_FILE=$(find "${OUTPUT_DIR}" -type f -name "*.nii.gz" | head -n1)
        NIFTI_NAME=$(basename "$NIFTI_FILE")
        META_FILE="${NIFTI_FILE%.nii.gz}.json"
        META_NAME=$(basename "$META_FILE")

        echo -n "$NIFTI_NAME" > $(results.nifti_filename.path)
        echo -n "$META_NAME" > $(results.metadata_filename.path)

        echo " Conversion complete. Example outputs:"
        find "${OUTPUT_DIR}" -type f | head -n 10 || true

---

# TASK 3: Run pl-emerald + mask + metadata check
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: emerald-extraction
spec:
  params:
    - name: pattern
      type: string
    - name: maskSuffix
      type: string
      default: "_mask.nii"
    - name: patientId
      type: string
    - name: studyId
      type: string
    - name: seriesId
      type: string
  workspaces:
    - name: shared
  steps:
    # Step 1: Run EMERALD segmentation
    - name: emerald
      image: ghcr.io/fnndsc/pl-emerald:latest
      script: |
        #!/bin/sh
        set -eux
        INPUT_DIR="$(workspaces.shared.path)/NIFTI"
        OUTPUT_DIR="$(workspaces.shared.path)/EMERALD"
        mkdir -p "${OUTPUT_DIR}"

        echo "Running EMERALD extraction..."
        emerald --pattern "$(params.pattern)" \
                --mask-suffix "$(params.maskSuffix)" \
                "${INPUT_DIR}" "${OUTPUT_DIR}"

        echo "Extraction complete. Example outputs:"
        find "${OUTPUT_DIR}" -type f | head -n 10 || true

    # Step 2: Apply mask to MRI using nibabel + numpy
    - name: apply-mask
      image: python:3.11-slim
      script: |
        #!/usr/bin/env bash
        pip install nibabel numpy
        python3 - <<'EOF'
        import nibabel as nib
        import numpy as np
        import glob
        import os

        mri_path = "$(workspaces.shared.path)/NIFTI/$(params.pattern)"
        base_name = os.path.basename(mri_path).replace(".nii.gz", "")
        mask_candidates = glob.glob(f"$(workspaces.shared.path)/EMERALD/{base_name}*mask*.nii*")

        if not mask_candidates:
            raise FileNotFoundError(f"No mask found for {mri_path}")
        mask_path = mask_candidates[0]

        out_path = "$(workspaces.shared.path)/EMERALD/MR_masked_brain.nii.gz"
        print(f"Loading MRI from {mri_path}")
        print(f"Loading mask from {mask_path}")

        mri_img = nib.load(mri_path)
        mask_img = nib.load(mask_path)
        mri_data = mri_img.get_fdata()
        mask_data = mask_img.get_fdata()

        print("MRI shape:", mri_data.shape)
        print("Mask shape:", mask_data.shape)

        if mri_data.shape != mask_data.shape:
            raise ValueError("MRI and mask shapes do not match. Check registration or affine matrices.")

        masked_data = mri_data * (mask_data > 0)
        masked_img = nib.Nifti1Image(masked_data, affine=mri_img.affine, header=mri_img.header)
        nib.save(masked_img, out_path)
        print(f"Saved masked volume: {out_path}")

    # # Step 3: Inspect DICOM metadata (sanity check)
    # - name: inspect-dicom
    #   image: python:3.11-slim
    #   script: |
    #     #!/usr/bin/env sh
    #     set -eux
    #     pip install --no-cache-dir pydicom
    #     python3 - <<'EOF'

    #     import pydicom
    #     ds = pydicom.dcmread("$(workspaces.shared.path)/$(params.patientId)/$(params.studyId)/$(params.seriesId)/IM_0001.dcm")
    #     print(ds)

---

# TASK 4: Convert NIFTI → DICOM (fixed for image pull)
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: nifti2dicom-convert
spec:
  params:
    - name: niftiFilename
      type: string
      description: "Name of the NIFTI file to convert back to DICOM"
    - name: patientId
      type: string
      description: "Patient ID (used for metadata restoration)"
    - name: studyId
      type: string
      description: "Study ID for locating reference DICOMs"
    - name: seriesId
      type: string
      description: "Series ID for locating reference DICOMs"
    - name: SOPClassUID
      type: string
      description: "SOP Class UID to set in DICOM metadata"
  workspaces:
    - name: shared
  steps:
    # Convert using reference DICOM for metadata
    - name: convert-with-reference
      image: python:3.11-slim
      script: |
        #!/usr/bin/env bash
        set -eux
        pip install --no-cache-dir pydicom nibabel numpy scikit-image
        
        python3 - <<'EOF'
        import os
        import pydicom
        import nibabel as nib
        import numpy as np
        from datetime import datetime
        import glob
        from skimage import transform
        
        # Paths
        workspace = "$(workspaces.shared.path)"
        nifti_path = os.path.join(workspace, "EMERALD", "MR_masked_brain.nii.gz")
        original_dicom_dir = os.path.join(workspace, "$(params.patientId)", "$(params.studyId)", "$(params.seriesId)")
        output_dir = os.path.join(workspace, "DICOM_RECONVERTED")
        os.makedirs(output_dir, exist_ok=True)
        
        print(f"Loading NIFTI from: {nifti_path}")
        print(f"Reference DICOM directory: {original_dicom_dir}")
        
        # Load NIFTI
        nii_img = nib.load(nifti_path)
        nii_data = nii_img.get_fdata()
        nii_affine = nii_img.affine
        
        print(f"NIFTI shape: {nii_data.shape}")
        print(f"NIFTI data type: {nii_data.dtype}")
        print(f"NIFTI value range: [{nii_data.min():.2f}, {nii_data.max():.2f}]")
        
        # Find and sort reference DICOMs
        ref_dicoms = sorted(
            glob.glob(os.path.join(original_dicom_dir, "**", "*.dcm"), recursive=True)
        )
        
        if not ref_dicoms:
            raise FileNotFoundError(f"No reference DICOMs found under {original_dicom_dir}")
        
        # Load reference DICOMs
        ref_datasets = []
        for dcm_file in ref_dicoms:
            try:
                ds = pydicom.dcmread(dcm_file)
                if hasattr(ds, 'ImagePositionPatient') and hasattr(ds, 'InstanceNumber'):
                    ref_datasets.append(ds)
            except Exception as e:
                print(f"Warning: Could not read {dcm_file}: {e}")
        
        if not ref_datasets:
            raise ValueError("No valid reference DICOMs with spatial information found")
        
        # Sort by instance number
        ref_datasets.sort(key=lambda x: int(x.InstanceNumber))
        ref_ds = ref_datasets[0]
        
        print(f"Reference DICOM shape: {ref_ds.Rows} x {ref_ds.Columns}")
        print(f"Reference DICOM BitsStored: {ref_ds.BitsStored}")
        
        # Get original DICOM intensity range
        ref_pixel_array = ref_ds.pixel_array
        ref_min = ref_pixel_array.min()
        ref_max = ref_pixel_array.max()
        print(f"Reference DICOM value range: [{ref_min}, {ref_max}]")
        
        # Check if resampling is needed
        target_rows = ref_ds.Rows
        target_cols = ref_ds.Columns
        
        needs_resampling = (nii_data.shape[0] != target_rows or 
                           nii_data.shape[1] != target_cols)
        
        if needs_resampling:
            print(f"⚠️  Resolution mismatch detected!")
            print(f"   NIFTI: {nii_data.shape[0]}x{nii_data.shape[1]}")
            print(f"   Target: {target_rows}x{target_cols}")
            print(f"   Resampling to match original resolution...")
        
        # Extract spatial parameters
        pixel_spacing = list(map(float, ref_ds.PixelSpacing))
        
        if len(ref_datasets) > 1:
            pos1 = np.array(ref_datasets[0].ImagePositionPatient, dtype=float)
            pos2 = np.array(ref_datasets[1].ImagePositionPatient, dtype=float)
            slice_spacing = float(np.linalg.norm(pos2 - pos1))
        else:
            slice_spacing = float(getattr(ref_ds, 'SliceThickness', 1.0))
        
        image_orientation = list(map(float, ref_ds.ImageOrientationPatient))
        row_cosines = np.array(image_orientation[:3])
        col_cosines = np.array(image_orientation[3:])
        slice_cosines = np.cross(row_cosines, col_cosines)
        start_position = np.array(ref_ds.ImagePositionPatient, dtype=float)
        
        # Determine bit depth from reference
        bits_stored = ref_ds.BitsStored
        max_value = (2 ** bits_stored) - 1
        
        print(f"Using {bits_stored}-bit depth (max value: {max_value})")
        
        # Get number of slices
        num_slices = nii_data.shape[2]
        print(f"Converting {num_slices} slices...")
        
        # Generate new UIDs
        new_study_uid = ref_ds.StudyInstanceUID
        new_series_uid = pydicom.uid.generate_uid()
        
        # Determine rescale parameters from original data
        # Get window center/width if available
        window_center = float(getattr(ref_ds, 'WindowCenter', 0))
        window_width = float(getattr(ref_ds, 'WindowWidth', max_value))
        rescale_intercept = float(getattr(ref_ds, 'RescaleIntercept', 0))
        rescale_slope = float(getattr(ref_ds, 'RescaleSlope', 1))
        
        print(f"Original display window: Center={window_center}, Width={window_width}")
        print(f"Original rescale: Slope={rescale_slope}, Intercept={rescale_intercept}")
        
        for slice_idx in range(num_slices):
            # Create new DICOM from reference
            new_ds = ref_ds.copy()
            
            # Extract slice data
            slice_data = nii_data[:, :, slice_idx].copy()
            slice_data = np.rot90(slice_data, k=1)
            
            # Resample if needed (use order=1 for bilinear, order=3 for bicubic)
            if needs_resampling:
                slice_data = transform.resize(
                    slice_data, 
                    (target_rows, target_cols),
                    order=3,  # bicubic interpolation for better quality
                    mode='edge',
                    preserve_range=True,
                    anti_aliasing=True
                )
            
            # Preserve intensity range - DO NOT normalize to full bit depth
            # This maintains the contrast of the masked brain
            slice_min = nii_data.min()  # Use global min/max from entire volume
            slice_max = nii_data.max()
            
            if slice_max > slice_min:
                # Map to same range as original DICOM
                # This preserves relative intensities
                slice_normalized = ((slice_data - slice_min) / (slice_max - slice_min) * 
                                  (ref_max - ref_min) + ref_min)
                slice_normalized = np.clip(slice_normalized, 0, max_value).astype(np.uint16)
            else:
                slice_normalized = np.zeros_like(slice_data, dtype=np.uint16)
            
            # Update pixel data
            new_ds.PixelData = slice_normalized.tobytes()
            
            # Update image dimensions
            new_ds.Rows = slice_normalized.shape[0]
            new_ds.Columns = slice_normalized.shape[1]
            new_ds.BitsAllocated = 16
            new_ds.BitsStored = bits_stored
            new_ds.HighBit = bits_stored - 1
            new_ds.SamplesPerPixel = 1
            new_ds.PhotometricInterpretation = "MONOCHROME2"
            new_ds.PixelRepresentation = 0
            
            # Preserve rescale parameters
            new_ds.RescaleIntercept = rescale_intercept
            new_ds.RescaleSlope = rescale_slope
            
            # Preserve window settings for consistent display
            new_ds.WindowCenter = window_center
            new_ds.WindowWidth = window_width
            
            # Update spatial positioning metadata
            slice_position = start_position + (slice_spacing * slice_idx * slice_cosines)
            new_ds.ImagePositionPatient = [f"{x:.6f}" for x in slice_position]
            new_ds.SliceLocation = f"{slice_spacing * slice_idx:.6f}"
            new_ds.ImageOrientationPatient = [f"{x:.6f}" for x in image_orientation]
            new_ds.PixelSpacing = [f"{x:.6f}" for x in pixel_spacing]
            new_ds.SliceThickness = f"{slice_spacing:.6f}"
            new_ds.SpacingBetweenSlices = f"{slice_spacing:.6f}"
            
            # Update UIDs
            new_ds.SeriesInstanceUID = new_series_uid
            new_ds.SOPInstanceUID = pydicom.uid.generate_uid()
            new_ds.file_meta.MediaStorageSOPInstanceUID = new_ds.SOPInstanceUID
            
            # Update instance number
            new_ds.InstanceNumber = slice_idx + 1
            
            # Update series metadata
            new_ds.SeriesDescription = "AI Brain Mask - EMERALD"
            new_ds.SeriesNumber = getattr(ref_ds, 'SeriesNumber', 999) + 1000
            
            # Update timestamps
            now = datetime.now()
            new_ds.SeriesDate = now.strftime('%Y%m%d')
            new_ds.SeriesTime = now.strftime('%H%M%S')
            new_ds.ContentDate = now.strftime('%Y%m%d')
            new_ds.ContentTime = now.strftime('%H%M%S')
            
            # Ensure Transfer Syntax
            if not hasattr(new_ds.file_meta, 'TransferSyntaxUID'):
                new_ds.file_meta.TransferSyntaxUID = pydicom.uid.ExplicitVRLittleEndian
            
            # Save DICOM
            output_path = os.path.join(output_dir, f"slice_{slice_idx:04d}.dcm")
            new_ds.save_as(output_path, write_like_original=False)
            
            if slice_idx % 10 == 0:
                print(f"Processed slice {slice_idx + 1}/{num_slices}")
        
        print(f"\n Successfully created {num_slices} DICOM slices in {output_dir}")
        print(f"Series UID: {new_series_uid}")
        
        # Verify first slice
        verify_ds = pydicom.dcmread(os.path.join(output_dir, "slice_0000.dcm"))
        verify_array = verify_ds.pixel_array
        print(f"\nVerification - First slice:")
        print(f"  Dimensions: {verify_ds.Rows} x {verify_ds.Columns}")
        print(f"  Value range: [{verify_array.min()}, {verify_array.max()}]")
        print(f"  Bits Stored: {verify_ds.BitsStored}")
        print(f"  Window: C={verify_ds.WindowCenter}, W={verify_ds.WindowWidth}")
        EOF

        
        

---

# TASK 5: Upload processed DICOM back to Orthanc
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: upload-to-orthanc
spec:
  params:
    - name: orthancUrl
      type: string
    - name: orthancAuth
      type: string
    - name: seriesId
      type: string
      description: "Original series ID (for tagging)"
  workspaces:
    - name: shared
  steps:
    - name: upload
      image: curlimages/curl:8.7.1
      script: |
        #!/bin/sh
        set -eux
        
        DICOM_DIR="$(workspaces.shared.path)/DICOM_RECONVERTED"
        
        echo "Uploading processed DICOMs to Orthanc..."
        
        # Count total files
        TOTAL=$(find "${DICOM_DIR}" -type f -name "*.dcm" | wc -l)
        echo "Found ${TOTAL} DICOM files to upload"
        
        COUNT=0
        for dcm_file in "${DICOM_DIR}"/*.dcm; do
          if [ -f "$dcm_file" ]; then
            COUNT=$((COUNT + 1))
            
            # Add custom metadata to mark as processed
            # This prevents triggering another pipeline run
            curl -s -u "$(params.orthancAuth)" \
              -X POST \
              -H "Content-Type: application/dicom" \
              --data-binary "@${dcm_file}" \
              "$(params.orthancUrl)/instances" \
              -o /tmp/upload_response.json
            
            # Tag the uploaded instance with metadata indicating it's processed
            INSTANCE_ID=$(cat /tmp/upload_response.json | grep -o '"ID"[[:space:]]*:[[:space:]]*"[^"]*"' | cut -d'"' -f4)
            
            if [ -n "$INSTANCE_ID" ]; then
              # Mark as AI-processed to prevent re-triggering
              curl -s -u "$(params.orthancAuth)" \
                -X PUT \
                -H "Content-Type: text/plain" \
                -d "EMERALD-Processed-$(params.seriesId)" \
                "$(params.orthancUrl)/instances/${INSTANCE_ID}/metadata/1234"
              
              if [ $((COUNT % 10)) -eq 0 ]; then
                echo "Uploaded ${COUNT}/${TOTAL} files..."
              fi
            fi
          fi
        done
        
        echo "Successfully uploaded ${COUNT} DICOM files to Orthanc"
        echo "New AI-processed series created"

---

# PIPELINE: download -> pl-dcm2niix -> pl-emerald
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: orthanc-to-better-dicom
spec:
  params:
    - name: orthancUrl
      type: string
    - name: orthancAuth
      type: string
    - name: patientId
      type: string
    - name: studyId
      type: string
    - name: seriesId
      type: string
    - name: SOPClassUID
      type: string
    - name: pattern
      type: string
    - name: maskSuffix
      type: string
      default: "_mask.nii"
  workspaces:
    - name: shared
  tasks:
    - name: download
      taskRef:
        name: download-orthanc-series
      params:
        - name: orthancUrl
          value: $(params.orthancUrl)
        - name: orthancAuth
          value: $(params.orthancAuth)
        - name: patientId
          value: $(params.patientId)
        - name: studyId
          value: $(params.studyId)
        - name: seriesId
          value: $(params.seriesId)
        - name: SOPClassUID
          value: $(params.SOPClassUID)
      workspaces:
        - name: shared
          workspace: shared

    - name: convert
      runAfter: [download]
      taskRef:
        name: dcm2niix-convert
      params:
        - name: patientId
          value: $(params.patientId)
        - name: studyId
          value: $(params.studyId)
        - name: seriesId
          value: $(params.seriesId)
      workspaces:
        - name: shared
          workspace: shared

    - name: emerald
      runAfter: [convert]
      taskRef:
        name: emerald-extraction
      params:
        - name: pattern
          value: "$(tasks.convert.results.nifti_filename)"
        - name: maskSuffix
          value: $(params.maskSuffix)
        - name: patientId
          value: $(params.patientId)
        - name: studyId
          value: $(params.studyId)
        - name: seriesId
          value: $(params.seriesId)
      workspaces:
        - name: shared
          workspace: shared

    
    - name: nifti2dicom
      runAfter: [emerald]
      taskRef:
        name: nifti2dicom-convert
      params:
        - name: niftiFilename
          value: "$(tasks.convert.results.nifti_filename)"
        - name: patientId
          value: $(params.patientId)
        - name: studyId
          value: $(params.studyId)       
        - name: seriesId
          value: $(params.seriesId)    
        - name: SOPClassUID
          value: $(params.SOPClassUID)
      workspaces:
        - name: shared
          workspace: shared
    
    - name: upload
      runAfter: [nifti2dicom]
      taskRef:
        name: upload-to-orthanc
      params:
        - name: orthancUrl
          value: $(params.orthancUrl)
        - name: orthancAuth
          value: $(params.orthancAuth)
        - name: seriesId
          value: $(params.seriesId)
      workspaces:
        - name: shared
          workspace: shared