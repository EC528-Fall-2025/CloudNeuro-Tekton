# Minimal CloudNeuro Configuration
# For testing or resource-constrained environments

global:
  namespace: cloudneuro

orthanc:
  enabled: true
  persistence:
    size: 5Gi
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"

tekton:
  enabled: true
  pipelines:
    freesurfer:
      enabled: true
      resources:
        requests:
          memory: "2Gi"
          cpu: "1000m"
        limits:
          memory: "8Gi"
          cpu: "4000m"

storage:
  input:
    size: 10Gi
  output:
    size: 20Gi
  cache:
    size: 10Gi
