# Production CloudNeuro Configuration
# High-performance setup for production workloads

global:
  namespace: cloudneuro-prod

orthanc:
  enabled: true
  persistence:
    enabled: true
    size: 100Gi
    storageClass: ""  # Set to your cluster's fast storage class (e.g., "fast-ssd")
  resources:
    requests:
      memory: "2Gi"
      cpu: "1000m"
    limits:
      memory: "8Gi"
      cpu: "4000m"

tekton:
  enabled: true
  pipelines:
    freesurfer:
      enabled: true
      resources:
        requests:
          memory: "16Gi"
          cpu: "8000m"
        limits:
          memory: "64Gi"
          cpu: "32000m"

storage:
  input:
    size: 500Gi
    storageClass: ""  # Set to your cluster's storage class
    accessMode: ReadWriteMany
  output:
    size: 1Ti
    storageClass: ""  # Set to your cluster's storage class
    accessMode: ReadWriteMany
  cache:
    size: 200Gi
    storageClass: ""  # Set to your cluster's storage class
    accessMode: ReadWriteOnce

serviceAccount:
  create: true
  name: cloudneuro-pipeline-sa

rbac:
  create: true
