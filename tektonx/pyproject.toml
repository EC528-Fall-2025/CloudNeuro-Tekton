[project]
name = "tektonx"
version = "0.1.0"
description = "Convert K8s Job/Pod or Tekton Task/TaskRun YAML to a bash script"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["typer", "pyyaml", "rich"]

[project.scripts]
tektonx = "tektonx.cli:app"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
